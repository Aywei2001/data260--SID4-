# Single-node local homework environment. Application entities remain in memory.
x-app: &app
  build: .
  image: s1339-recall-app:local
  environment:
    DATABASE_URL: sqlite:////data/hw7-docker.db
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    KAFKA_PREFIX: s1339
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  volumes:
    - auth-data:/data

services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  init-topics:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic s1339_entity_requests --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic s1339_entity_responses --partitions 1 --replication-factor 1

  init-db:
    <<: *app
    # Import once before worker/API start, avoiding concurrent table creation.
    command: ["python", "-c", "import hw7_authentication; print('Authentication database ready')"]

  worker:
    <<: *app
    command: ["python", "hw7_authentication.py", "worker"]
    depends_on:
      init-topics:
        condition: service_completed_successfully
      init-db:
        condition: service_completed_successfully

  api:
    <<: *app
    ports:
      - "127.0.0.1:8439:8439"
    depends_on:
      init-topics:
        condition: service_completed_successfully
      init-db:
        condition: service_completed_successfully

volumes:
  auth-data:

