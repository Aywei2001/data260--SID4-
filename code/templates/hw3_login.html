<!DOCTYPE html>
<html lang = "en">
<head>
<title>Log Into Your Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class = "bg-light">
    <div class = "container mt-5">
        {% if error %}
        <div class = "alert alert-danger alert-dismissible fade show" role = "alert">
            <strong>Log in failed!</strong>{{error}}
            <button type = "button" class = "btn-close" data-bs-dismiss = "alert" aria-label = "Close"></button>
        </div>
        {% endif %}
        <div class = "card-header bg-primary text-black">
            <h2>Log In</h2>
        </div>
        
        <div class = "card-body p-6">
            <form action = "/login" method = "post">
                <div class = "mb-3">
                    <label for = "user" class = "form label">Username * :</label><br>
                    <input type = "text" id = "user" name = "user" class = "form control" placeholder = "Username" required>
                </div>
                
                <div class = "mb-3">
                    <label for = "pass" class = "form label">Password * :</label><br>
                    <input type = "text" id = "pass" name = "pass_wrd" class = "form control" placeholder = "Password" required>
                </div>
                <div class = "d-grid gap-3">
                    <button type = "submit" class = "btn btn-primary">Submit</button>
                </div>
            </form>
        </div>   
    </div>
</body>
</html>
