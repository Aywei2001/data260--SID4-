<!DOCTYPE html>
<html lang = "en">
<head>
<title>Welcome!</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class = "bg-light">
    <nav class = "navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class = "container">
            <a class = "navbar-brand" href = "/">Data260 HW3</a>
            <div class = "navbar-nav ms-auto">
                {%  if user %}
                <span class = "nav-link text-light me-3">Logged in as: {{user}} </span>
                <a class = "nav-link" href = "/logout">Log Out</a>
                {% else %}
                <a class = "nav-link" href = "/login">Log In</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class = "container mt-5">
        <div class = "card-header bg-primary text-black">
            <h2>Welcome!</h2>
            <h2>Please select where you want to go:</h2>
        </div>
        <div class = "card-body p-6 text-center">
            {%  if user %}
            <div class = "mb-3">
                <a href = "/dashboard"class = "btn btn-primary btn-lg" >Go to Dashboard</a>
                <a href = "/logout" class = "btn btn-danger btn-lg" >Log Out</a>
            </div>
            {% else %}
            <div class = "mb-3">
                <a href = "/login" class = "btn btn-primary btn-lg" >Log In</a>
            </div>
            {% endif %}
        </div>      
    </div>    
</body>
</html>
